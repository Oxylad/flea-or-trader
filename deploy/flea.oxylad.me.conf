# flea.oxylad.me: Flea or Trader (Bun on 127.0.0.1:3007, PM2 flea-or-trader)

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name flea.oxylad.me;
    return 301 https://flea.oxylad.me$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name flea.oxylad.me;

    ssl_certificate /etc/ssl/cloudflare/oxylad.me.pem;
    ssl_certificate_key /etc/ssl/cloudflare/oxylad.me-key.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # One screenshot per request; the client keeps uploads under 4 MB.
    client_max_body_size 8m;

    # The app compresses market data itself; this covers the page bundle.
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript image/svg+xml text/plain;

    # Pages for errors nginx produces itself: the app is stopped, restarting or too
    # slow, or an upload is over client_max_body_size. Without proxy_intercept_errors,
    # errors the app returns (its own 404/500 pages, API JSON) pass through untouched.
    # The files are generated by `bun run build:errors`.
    error_page 404 /errors/404.html;
    error_page 413 /errors/413.html;
    error_page 502 /errors/502.html;
    error_page 503 /errors/503.html;
    error_page 504 /errors/504.html;

    location ^~ /errors/ {
        internal;
        root /home/debian/home/external-projects/flea-or-trader/public;
        add_header Cache-Control "no-store" always;
    }

    # The page reads API errors as JSON, so these get a JSON body instead.
    location ^~ /api/ {
        error_page 502 503 504 /errors/api-unavailable.json;
        error_page 413 /errors/413.html;

        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
